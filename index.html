<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTLY - Welcome</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
</head>
<body class="bg-brand-cream w-screen h-screen overflow-hidden relative flex flex-col justify-center items-center font-sans antialiased selection:bg-brand-coklat selection:text-white">

    <svg class="absolute top-12 left-10 w-32 h-32 text-brand-coklatmuda opacity-40 animate-pulse pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
        <circle cx="50" cy="50" r="8"/>
        <circle cx="85" cy="20" r="5"/>
        <circle cx="15" cy="80" r="6"/>
        <path d="M50 50 L85 20 M50 50 L15 80" stroke="currentColor" stroke-width="2"/>
    </svg>

    <svg class="absolute bottom-10 right-10 w-56 h-56 text-brand-birutua opacity-10 animate-[pulse_4s_ease-in-out_infinite] pointer-events-none" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="50" cy="50" r="30" stroke-dasharray="4 4" />
        <circle cx="50" cy="50" r="45" opacity="0.5"/>
        <path d="M50 5 L50 15 M50 85 L50 95 M5 50 L15 50 M85 50 L95 50" />
    </svg>

    <svg class="absolute top-1/4 right-[10%] w-20 h-20 text-brand-coklat opacity-20 animate-bounce pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>

    <svg class="absolute bottom-1/4 left-[15%] w-16 h-16 text-brand-gray opacity-30 animate-pulse pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
        <circle cx="20" cy="20" r="4"/>
        <circle cx="80" cy="80" r="4"/>
        <circle cx="80" cy="20" r="4"/>
        <circle cx="20" cy="80" r="4"/>
    </svg>

    <div class="relative z-10 flex flex-col items-center text-center px-6 w-full max-w-2xl">
        <img src="assets/img/Logo.png" alt="Craftly Logo" class="w-64 md:w-80 lg:w-96 object-contain mb-8 drop-shadow-2xl transform transition-transform hover:scale-105 duration-500">
        
        <h2 class="text-2xl md:text-3xl lg:text-4xl font-serif font-bold text-brand-birutua mb-4 leading-snug">
            Empowering Indonesian <br>
            Artisans with <span class="text-brand-coklat">AI</span>
        </h2>
        
        <p class="text-brand-gray text-sm md:text-base mb-12 font-medium tracking-wide">
            Weaving Local Craft, Empowering the Future.
        </p>

        <a href="onboarding.html" class="group flex items-center justify-center bg-brand-birutua text-brand-cream px-8 py-3.5 md:px-10 md:py-4 rounded-full font-bold text-sm md:text-base hover:bg-brand-coklat transition-all duration-300 shadow-xl hover:shadow-2xl active:scale-95 border border-transparent hover:border-brand-cream/30">
            <span>Explore Platform</span>
            <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
        </a>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
