<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTLY - Welcome</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
</head>
<body class="bg-gradient-to-br from-[#ffffff] via-[#fcfaf6] to-[#eae1d5] w-screen h-screen overflow-hidden relative flex flex-col font-sans antialiased selection:bg-brand-coklat selection:text-white">
    
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(192,96,58,0.04)_0%,transparent_70%)] pointer-events-none"></div>

    <a href="onboarding.html" class="absolute inset-0 z-50 cursor-pointer"></a>

    <img src="assets/img/batik-top-right.png" class="absolute top-0 right-0 w-56 md:w-80 lg:w-[26rem] object-contain pointer-events-none z-0 opacity-95">
    <img src="assets/img/batik-bot-left.png" class="absolute bottom-0 left-0 w-48 md:w-72 lg:w-96 object-contain pointer-events-none z-0 opacity-95">

    <div class="relative z-10 flex-1 flex flex-col justify-center items-center px-6 mt-12 md:mt-0">
        <div class="relative">
            <div class="absolute inset-0 bg-brand-coklat/20 blur-3xl rounded-full scale-[1.3] animate-pulse pointer-events-none"></div>
            <img src="assets/img/Logo.png" alt="Craftly" class="relative w-48 md:w-64 object-contain mb-8 drop-shadow-xl">
        </div>
        
        <h2 class="text-xl md:text-2xl font-bold text-brand-birutua text-center leading-snug tracking-wide mb-12 drop-shadow-sm">
            Empowering Indonesian<br>Artisans with <span class="text-brand-coklat">AI</span>
        </h2>
        
        <div class="flex flex-col items-center gap-2 animate-bounce opacity-80 mt-4">
            <span class="text-[0.65rem] md:text-xs font-bold text-brand-coklat uppercase tracking-[0.3em]">Tap to Explore</span>
            <i class="fa-solid fa-angles-down text-brand-coklat text-sm md:text-base"></i>
        </div>
    </div>

    <div class="relative z-10 w-full pb-16 md:pb-12 flex justify-center pointer-events-none">
        <p class="text-[0.7rem] md:text-xs font-semibold text-brand-birutua/80 text-center tracking-[0.05em] leading-relaxed">
            Weaving Local Craft,<br>Empowering the Future.
        </p>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
